<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: game-menu roster screen. Featured player card on top, sortable grade table below, pager at the foot. Deliberate single dark look. */
:root{
  --bg:#0f1622; --panel:#18222f; --panel-2:#1f2b3a; --line:#2c3a4c; --fg:#e8edf3; --muted:#8d9bad;
  --gold:#f2c230; --gold-ink:#1a1405; --red:#d8343c;
  --g-a:#5ad37f; --g-b:#b5d65a; --g-c:#e8c45a; --g-d:#e8904f; --g-f:#e0585a;
  --f-disp:"Barlow Condensed","Noto Sans TC","Arial Narrow",sans-serif;
  --f-body:"Barlow","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(1200px 500px at 85% -10%,#22324a 0%,transparent 60%);}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-disp);font-weight:800;font-style:italic;font-size:2rem;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--gold)}
.src{color:var(--muted);font-size:.8rem}
/* featured card */
.card{display:grid;grid-template-columns:auto 1fr auto;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-height:150px}
.card .tag{background:var(--red);display:flex;flex-direction:column;justify-content:space-between;padding:14px 18px;min-width:150px;
  clip-path:polygon(0 0,100% 0,86% 100%,0 100%);padding-right:40px}
.tag .pos{font-family:var(--f-disp);font-weight:700;background:#fff;color:var(--red);padding:1px 8px;border-radius:3px;align-self:flex-start;font-size:1rem}
.tag .rk{font-family:var(--f-disp);font-weight:800;font-style:italic;font-size:3.4rem;line-height:1;color:#fff}
.tag .rk small{font-size:1.4rem;opacity:.8;margin-right:2px}
.card .who{padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.who .nm{font-family:var(--f-disp);font-weight:800;text-transform:uppercase;line-height:.95;font-size:2.4rem;overflow-wrap:anywhere}
.who .nm .first{display:block;font-size:1.25rem;font-weight:600;color:var(--gold)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:.85rem}
.facts b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.strong{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-disp);font-weight:600;font-size:.9rem;letter-spacing:.03em;background:var(--panel-2);border:1px solid var(--line);padding:2px 9px;border-radius:3px}
.chip i{font-style:normal;margin-left:6px;font-variant-numeric:tabular-nums}
.ring{display:flex;align-items:center;justify-content:center;padding:12px 22px}
.ring svg{width:118px;height:118px}
.ring .lab{font-family:var(--f-disp);font-weight:600;fill:var(--fg);font-size:15px;letter-spacing:.05em}
.ring .val{font-family:var(--f-disp);font-weight:800;fill:var(--fg);font-size:40px}
/* controls */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel);color:var(--muted);border:0;border-right:1px solid var(--line);font:600 .9rem var(--f-disp);letter-spacing:.04em;padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.ctrl input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:3px;padding:6px 10px;font:500 .9rem var(--f-body);width:180px;max-width:100%}
.ctrl .lbl{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
/* table */
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:1060px;font-variant-numeric:tabular-nums}
thead th{background:#0b1119;color:var(--muted);font:600 .82rem var(--f-disp);letter-spacing:.04em;padding:6px 4px 7px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line);position:relative}
thead th .zh{display:block;font:500 .68rem var(--f-body);letter-spacing:0;opacity:.75;margin-top:1px}
thead tr.grp th{cursor:default;font-size:.7rem;padding:4px;color:#6b7a8d;border-bottom:0;letter-spacing:.12em}
thead tr.grp th.g{border-left:1px solid var(--line)}
thead th.sorted{color:var(--gold)}
thead th.sorted::before{content:"▼";font-size:.6rem;margin-right:2px}
thead th.sorted.asc::before{content:"▲"}
th.gl,td.gl{border-left:1px solid var(--line)}
td{padding:7px 4px;text-align:center;border-bottom:1px solid #222e3d;font:600 1.02rem var(--f-disp);letter-spacing:.02em}
td.nm,th.nm{text-align:left;padding-left:12px;position:sticky;left:0;z-index:1}
td.nm{background:var(--gold);color:var(--gold-ink);font-size:1.08rem;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
th.nm{background:var(--gold);color:var(--gold-ink);z-index:2}
td.no{color:var(--muted);font-size:.9rem;width:36px}
td.ovr{font-size:1.15rem;font-weight:800}
td.sub{color:var(--muted);font-weight:500;font-size:.92rem}
tbody tr{cursor:pointer}
tbody tr:hover td:not(.nm){background:var(--panel-2)}
tbody tr.sel td{background:var(--gold);color:var(--gold-ink)!important}
tbody tr.sel td.nm{background:#ffd54a}
.gA{color:var(--g-a)}.gB{color:var(--g-b)}.gC{color:var(--g-c)}.gD{color:var(--g-d)}.gF{color:var(--g-f)}
td.sortcol{background:rgba(242,194,48,.07)}
/* pager */
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pages{display:flex;flex-wrap:wrap;gap:4px}
.pages button,.more{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;font:600 .95rem var(--f-disp);min-width:34px;padding:5px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.pages button[aria-current="page"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pages button:disabled{opacity:.35;cursor:default}
.pages .gap{color:var(--muted);padding:5px 2px}
.more{padding:6px 14px}
.count{color:var(--muted);font-size:.85rem}
.legend{color:var(--muted);font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px 14px}
@media (max-width:640px){
  .card{grid-template-columns:1fr auto}
  .card .tag{display:none}
  .who .nm{font-size:1.8rem}
  .ring{padding:10px 12px}.ring svg{width:92px;height:92px}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pager-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip.dim{opacity:.7}
td.empty{padding:24px;color:var(--muted);font:500 .95rem var(--f-body)}
th.noh{cursor:default}
</style>

const COLS = DATA.cols;
const P = DATA.rows.map(r => Object.fromEntries(COLS.map((c, i) => [c, r[i]])));
const GROUPS = [
  ['投籃', [['long', '3PT', '三分'], ['mid', 'MID', '中距離'], ['short', 'INS', '近框'], ['ft', 'FT', '罰球']]],
  ['進攻', [['drive', 'DRV', '切入'], ['pass', 'PASS', '傳球'], ['tovSkill', 'HDL', '護球'], ['creation', 'CRT', '自主創造']]],
  ['身體', [['rebound', 'REB', '籃板'], ['physique', 'PHYS', '身體'], ['stamina', 'STA', '體力']]],
  ['防守', [['onBall', 'PER D', '單防'], ['help', 'HELP', '協防'], ['pressure', 'PRES', '壓命中率']]],
];
const ATTR = GROUPS.flatMap(g => g[1]);
const TEXT_KEYS = new Set(['name', 'pos', 'team']);
const SIZE = 20;
const st = { sort: 'ovr', asc: false, pos: 'ALL', min: 0, mode: 'grade', q: '', page: 0, extra: 0, sel: P[0].name };

function grade(v) {
  const t = [[93, 'A+'], [87, 'A'], [82, 'A-'], [77, 'B+'], [72, 'B'], [68, 'B-'], [64, 'C+'], [60, 'C'], [56, 'C-'], [52, 'D+'], [48, 'D'], [44, 'D-']];
  for (const [m, g] of t) if (v >= m) return g;
  return 'F';
}
const gcls = g => 'g' + g[0];
const ht = i => Math.floor(i / 12) + "'" + (i % 12) + '"';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function seg(id, opts, key) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (const [v, l] of opts) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = l;
    b.setAttribute('aria-pressed', String(st[key] === v));
    b.onclick = () => { st[key] = v; if (key !== 'mode') { st.page = 0; st.extra = 0; } render(); };
    el.appendChild(b);
  }
}

function list() {
  const q = st.q.trim().toLowerCase();
  const a = P.filter(p => (st.pos === 'ALL' || p.pos === st.pos) && p.min >= st.min &&
    (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
  const k = st.sort, d = st.asc ? 1 : -1;
  a.sort((x, y) => {
    const u = x[k], v = y[k];
    if (typeof u === 'string') return d * u.localeCompare(v) || (x.rank - y.rank);
    return d * (u - v) || (x.rank - y.rank);
  });
  return a;
}

function head() {
  const th = (k, en, zh, cls = '') =>
    `<th tabindex="0" data-k="${k}" class="${cls}${st.sort === k ? ' sorted' + (st.asc ? ' asc' : '') : ''}" title="依${zh}排序">${en}<span class="zh">${zh}</span></th>`;
  let g = '<tr class="grp"><th colspan="6"></th>' +
    GROUPS.map(x => `<th class="g" colspan="${x[1].length}">${x[0]}</th>`).join('') +
    '<th class="g" colspan="2">出場</th></tr>';
  let h = '<tr><th class="noh">#</th>' + th('name', 'NAME', '球員', 'nm') + th('pos', 'POS', '位置') + th('team', 'TEAM', '球隊') +
    th('ht', 'HT', '身高') + th('ovr', 'OVR', '總評');
  for (const x of GROUPS) x[1].forEach(([k, en, zh], i) => { h += th(k, en, zh, i === 0 ? 'gl' : ''); });
  h += th('min', 'MPG', '場均分鐘', 'gl') + th('gp', 'N', '已打場數') + th('dovr', 'ΔOVR', '相對上季卡') + '</tr>';
  const t = document.querySelector('#tbl thead');
  t.innerHTML = g + h;
  t.querySelectorAll('th[data-k]').forEach(el => {
    const go = () => {
      const k = el.dataset.k;
      if (st.sort === k) st.asc = !st.asc;
      else { st.sort = k; st.asc = TEXT_KEYS.has(k); }
      st.page = 0; st.extra = 0;
      render();
    };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

function cell(k, v, first) {
  const cls = [];
  if (first) cls.push('gl');
  if (st.sort === k) cls.push('sortcol');
  if (st.mode === 'num') return `<td class="${cls.join(' ')}">${v}</td>`;
  const g = grade(v);
  cls.push(gcls(g));
  return `<td class="${cls.join(' ')}" title="${v}">${g}</td>`;
}

function card(p) {
  const parts = p.name.split(' ');
  const first = parts.length > 1 ? parts.shift() : '';
  const last = parts.join(' ');
  const ranked = ATTR.map(a => [a[2], p[a[0]]]).sort((a, b) => b[1] - a[1]);
  const tops = ranked.slice(0, 3), low = ranked[ranked.length - 1];
  const C = 2 * Math.PI * 48, f = Math.max(0, Math.min(1, (p.ovr - 40) / (99 - 40)));
  const col = p.ovr >= 90 ? 'var(--g-a)' : p.ovr >= 80 ? 'var(--g-b)' : p.ovr >= 70 ? 'var(--g-c)' : p.ovr >= 60 ? 'var(--g-d)' : 'var(--g-f)';
  const chip = (lab, v, dim) => `<span class="chip${dim ? ' dim' : ''}">${lab}<i class="${gcls(grade(v))}">${grade(v)} ${v}</i></span>`;
  document.getElementById('card').innerHTML = `
    <div class="tag" style="${teamVars(p.team)}">${headshot(p)}<span class="pos">${p.pos}</span><span class="rk"><small>#</small>${p.rank}</span></div>
    <div class="who">
      <div class="nm"><span class="first">${esc(first)}</span>${esc(last)}</div>
      <div class="facts">
        <span>球隊 <b>${p.team}</b></span><span>身高 <b>${ht(p.ht)}</b></span>
        <span>場均 <b>${p.min.toFixed(1)}</b> 分鐘</span><span>已打 N=<b>${p.gp}</b> 場</span><span>上季卡 OVR <b>${p.last.toFixed(1)}</b>（<b>${(p.dovr > 0 ? '+' : '') + p.dovr.toFixed(2)}</b>）</span>
        <span>賽中預測每 36 分鐘淨值 <b>${p.imp > 0 ? '+' : ''}${p.imp.toFixed(2)}</b></span>
        ${p.dbon > 0 ? `<span>防守加分 <b>+${p.dbon.toFixed(2)}</b></span>` : ''}
      </div>
      <div class="strong">${tops.map(t => chip(t[0], t[1])).join('')}${chip('弱項 ' + low[0], low[1], true)}</div>
      ${realBox(p)}
    </div>
    <div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="OVR ${p.ovr}">
      <circle cx="60" cy="60" r="48" fill="#0b1119" stroke="#2c3a4c" stroke-width="7"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C * f} ${C}" transform="rotate(-90 60 60)"/>
      <text x="60" y="44" text-anchor="middle" class="lab">OVR</text>
      <text x="60" y="80" text-anchor="middle" class="val">${p.ovr.toFixed(1)}</text></svg></div>`;
}

function pages(n) {
  const tot = Math.max(1, Math.ceil(n / SIZE)), el = document.getElementById('pages');
  el.innerHTML = '';
  const mk = (l, pg, dis, cur) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = l; b.disabled = dis;
    if (cur) b.setAttribute('aria-current', 'page');
    b.onclick = () => { st.page = pg; st.extra = 0; render(); document.querySelector('.tbox').scrollIntoView({ block: 'nearest' }); };
    el.appendChild(b);
  };
  mk('‹', st.page - 1, st.page === 0);
  const show = [...new Set([0, tot - 1, st.page - 1, st.page, st.page + 1])].filter(x => x >= 0 && x < tot).sort((a, b) => a - b);
  let prev = -1;
  for (const i of show) {
    if (i - prev > 1) { const s = document.createElement('span'); s.className = 'gap'; s.textContent = '…'; el.appendChild(s); }
    mk(String(i + 1), i, false, i === st.page);
    prev = i;
  }
  mk('›', st.page + 1, st.page >= tot - 1);
}

function render() {
  seg('posSeg', [['ALL', '全部'], ['PG', 'PG'], ['SG', 'SG'], ['SF', 'SF'], ['PF', 'PF'], ['C', 'C']], 'pos');
  seg('minSeg', [[0, '全部'], [10, '≥10'], [20, '≥20'], [30, '≥30']], 'min');
  seg('modeSeg', [['grade', '等第'], ['num', '數值']], 'mode');
  head();
  const a = list();
  const start = st.page * SIZE, end = Math.min(a.length, start + SIZE * (1 + st.extra));
  const rows = a.slice(start, end);
  const sc = k => (st.sort === k ? ' sortcol' : '');
  document.querySelector('#tbl tbody').innerHTML = rows.map((p, i) => `
    <tr data-n="${encodeURIComponent(p.name)}" class="${p.name === st.sel ? 'sel' : ''}">
      <td class="no">${start + i + 1}</td>
      <td class="nm" title="${esc(p.name)}">${esc(p.name)}</td>
      <td class="sub${sc('pos')}">${p.pos}</td>
      <td class="sub${sc('team')}">${teamCell(p.team)}</td>
      <td class="sub${sc('ht')}">${ht(p.ht)}</td>
      <td class="ovr${sc('ovr')}">${p.ovr.toFixed(1)}</td>
      ${GROUPS.map(g => g[1].map(([k], j) => cell(k, p[k], j === 0)).join('')).join('')}
      <td class="sub gl${sc('min')}">${p.min.toFixed(1)}</td>
      <td class="sub${sc('gp')}">${p.gp}</td>
      <td class="sub${sc('dovr')}">${(v => (v > 0 ? '+' : '') + v.toFixed(1))(Math.abs(p.dovr) < 0.05 ? 0 : p.dovr)}</td>
    </tr>`).join('') || '<tr><td colspan="22" class="empty">沒有符合條件的球員。放寬位置或上場分鐘試試。</td></tr>';
  document.querySelectorAll('#tbl tbody tr[data-n]').forEach(tr => {
    tr.onclick = () => { st.sel = decodeURIComponent(tr.dataset.n); render(); };
  });
  card(P.find(p => p.name === st.sel) || P[0]);
  pages(a.length);
  document.getElementById('count').textContent = a.length ? `第 ${start + 1}–${end} 位，共 ${a.length} 人` : '0 人';
  const m = document.getElementById('more');
  m.hidden = end >= a.length;
  m.onclick = () => { st.extra++; render(); };
}

document.getElementById('q').oninput = e => { st.q = e.target.value; st.page = 0; st.extra = 0; render(); };
render();
</script>
