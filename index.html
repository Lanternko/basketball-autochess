<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COURTSIDE · Basketball Autochess</title><link rel="stylesheet" href="src/courtside.css"></head>
<body>
<header class="mast"><a class="brand" href="index.html">◉ COURTSIDE <small>BASKETBALL AUTOCHESS</small></a><a href="calculator.html">數值實驗室 ↗</a></header>
<main>
<section class="broadcast" aria-label="全場觀賽">
<header class="scoreboard" aria-label="比賽比分">
<div class="team home"><span class="team-symbol">主</span><label><span>HOME</span><select id="teamA" aria-label="主隊"></select></label></div>
<div class="score-center"><div class="scores"><strong id="scoreA">0</strong><div class="clock"><b id="replayClock">00:00</b><span>回放剩餘（原速）</span></div><strong id="scoreB">0</strong></div><div id="matchStatus">準備開賽</div></div>
<div class="team away"><label><span>AWAY</span><select id="teamB" aria-label="客隊"></select></label><span class="team-symbol">客</span></div>
</header>
<div class="live-stage">
<aside id="lineupA" class="lineup" aria-label="主隊場上五人"></aside>
<section class="arena"><div class="section-top"><span><i class="dot"></i><b id="courtStatus">等待開球</b></span><span>全場觀賽 · 5 對 5</span></div>
<div class="court-surround"><div id="court" class="court"><svg preserveAspectRatio="none" viewBox="0 0 1000 540" aria-label="全場籃球場" role="img"><defs><pattern id="wood" width="65" height="36" patternUnits="userSpaceOnUse"><path d="M0 0H65V36H0Z" fill="none" stroke="currentColor" stroke-opacity=".055"/></pattern></defs><rect width="1000" height="540" fill="url(#wood)"/><g class="court-lines" fill="none" stroke-width="2"><rect x="35" y="30" width="930" height="480"/><path d="M500 30V510"/><circle cx="500" cy="270" r="66"/><path d="M35 190H215V350H35M965 190H785V350H965"/><circle cx="215" cy="270" r="60"/><circle cx="785" cy="270" r="60"/><path d="M35 65H90A210 210 0 0 1 90 475H35M965 65H910A210 210 0 0 0 910 475H965"/></g><text x="500" y="265" text-anchor="middle" class="court-word">COURTSIDE</text><text x="500" y="287" text-anchor="middle" class="court-sub">LET THE GAME UNFOLD</text></svg><div class="basket" data-side="1" style="left:8.8%"><div class="backboard"></div><div class="net"></div><div class="rim"></div></div><div class="basket" data-side="0" style="left:91.2%"><div class="backboard"></div><div class="net"></div><div class="rim"></div></div><div id="tokens"></div><div id="ball-shadow" aria-hidden="true"></div><div id="ball" aria-label="籃球"></div></div></div>
<div class="court-caption"><span><i class="legend home-color"></i> 主隊 <i class="legend away-color"></i> 客隊</span><span id="eventCaption">點選球員追蹤位置</span></div></section>
<aside id="lineupB" class="lineup away-lineup" aria-label="客隊場上五人"></aside>
</div>
<div class="broadcast-call"><span class="call-label">場邊播報</span><div id="announcement" role="status" aria-live="polite">球員就位，等待開球。</div><button id="detailsToggle" aria-expanded="false" aria-controls="matchDetails">數據與紀錄 ↓</button></div>
<div class="playback"><button id="play" class="primary">▶ 播放</button><button id="step">下一事件 →</button><label class="speed">速度 <select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label><div class="timeline"><input id="seek" type="range" min="0" value="0" max="1" aria-label="比賽事件進度"><span id="progress">0 / 0</span></div><button id="reset">↺ 重播</button><button id="new">新比賽</button><button id="fullscreen" aria-label="全螢幕觀賽">⛶</button></div>
</section>
<div id="matchDetails" hidden><section class="box-section"><div class="section-heading"><h2>本場數據</h2><div class="tabs"><button id="tabA" aria-pressed="true">主隊</button><button id="tabB" aria-pressed="false">客隊</button></div><span>隨每個事件同步更新 · 命中／出手</span></div><div class="table-wrap"><table><thead><tr><th>球員</th><th>得分</th><th>籃板</th><th>抄截</th><th>火鍋</th><th>投籃</th><th>三分</th><th>罰球</th><th>失誤</th><th>犯規</th></tr></thead><tbody id="stats"></tbody></table></div></section>
<section class="commentary"><h2>事件紀錄</h2><ol id="feed"></ol></section></div>
<footer>固定五人陣容 · 每隊 50 次進攻。倒數為 1× 回放時間，非比賽計時；跑位與動作為事件演出。</footer>
</main><script type="module" src="src/courtside.js"></script></body></html>
